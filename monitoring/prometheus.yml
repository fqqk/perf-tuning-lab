global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nodejs'
    static_configs:
      - targets: ['chaos-nodejs:3000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'ruby'
    static_configs:
      - targets: ['chaos-ruby:3000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'go'
    static_configs:
      - targets: ['chaos-go:3000']
    metrics_path: '/metrics'
    scrape_interval: 5s
